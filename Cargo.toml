[package]
name = "fastgithub-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Native Rust Linux implementation of FastGithub"
license = "MIT"

[[bin]]
name = "fastgithub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
json5 = "0.4"
openssl = "0.10"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-openssl = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync", "fs", "process"] }
toml_edit = "0.22"
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
