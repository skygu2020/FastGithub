[package]
name = "fastgithub-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Native Rust Linux implementation of FastGithub"
license = "MIT"

[features]
default = []
native-doh = ["dep:hickory-resolver"]

[[bin]]
name = "fastgithub"
path = "src/main.rs"

[dependencies]
arc-swap = "1"
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "=0.25.2", default-features = false, features = ["tokio", "https-ring", "webpki-roots"], optional = true }
json5 = "0.4"
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "client-legacy", "http1", "http2"] }
tower-service = "0.3"
tokio-openssl = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync", "fs", "process"] }
toml_edit = "0.22"
tracing = "0.1"
tracing-appender = "0.2"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
