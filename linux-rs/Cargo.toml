[package]
name = "fastgithub-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Native Rust Linux implementation of FastGithub"
license = "MIT"

[[bin]]
name = "fastgithub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
